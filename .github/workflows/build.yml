name: Build and financial-integrity verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (H2 + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledgerline_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ledgerline_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/ledgerline_db
      DB_USERNAME: ledgerline_app
      DB_PASSWORD: ledgerline_ci_password
      MIGRATION_DB_URL: jdbc:postgresql://localhost:5432/ledgerline_db
      MIGRATION_DB_USERNAME: ledgerline_migrator
      MIGRATION_DB_PASSWORD: ledgerline_migration_password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Provision separate migration-owner and runtime roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ledgerline_db -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ledgerline_migrator LOGIN PASSWORD 'ledgerline_migration_password';
          CREATE ROLE ledgerline_app LOGIN PASSWORD 'ledgerline_ci_password';
          GRANT CONNECT ON DATABASE ledgerline_db TO ledgerline_app;
          ALTER DATABASE ledgerline_db OWNER TO ledgerline_migrator;
          ALTER SCHEMA public OWNER TO ledgerline_migrator;
          SQL
      - name: Run backend tests including PostgreSQL integrity suite
        working-directory: backend
        run: mvn --batch-mode test

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  container:
    name: Production container build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build application image
        run: docker build --tag ledgerline:${{ github.sha }} .

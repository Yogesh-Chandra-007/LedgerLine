spring.application.name=ledgerline-api
server.port=${PORT:8080}
server.forward-headers-strategy=framework
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
spring.datasource.username=${DB_USERNAME:ledgerline_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.url=${MIGRATION_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}}
spring.flyway.user=${MIGRATION_DB_USERNAME:ledgerline_migrator}
spring.flyway.password=${MIGRATION_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
ledgerline.database.advisory-locks=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}
spring.datasource.username=${DB_USERNAME:ledgerline_app}
spring.datasource.password=${DB_PASSWORD:ledgerline_ci_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.url=${MIGRATION_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/ledgerline_db}}
spring.flyway.user=${MIGRATION_DB_USERNAME:ledgerline_migrator}
spring.flyway.password=${MIGRATION_DB_PASSWORD:ledgerline_migration_password}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
ledgerline.database.advisory-locks=true
